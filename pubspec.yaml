name: cukkie
description: "A culinary recipe app called Cukkie."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  go_router: ^14.8.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  shared_preferences: ^2.2.3
  flutter_tts: ^4.0.2
  share_plus: ^10.0.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  pinput: ^5.0.0
  path: ^1.9.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.3
  image: ^4.10.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

